<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Corner Capital V5</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f9;
}

header{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
}

.container{
padding:20px;
}

.row{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-bottom:20px;
}

.shop{
width:110px;
height:70px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:white;
}

.sold{
background:#dc3545;
}

.available{
background:#198754;
}
</style>
</head>

<body>

<header>
<h1>The Corner Capital V5</h1>
<p>Firebase Connected</p>
</header>

<div class="container">
<div class="row" id="shops"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAhSE_7lzCegxf1bg19zyR3tvTWwTz8KF4",
authDomain: "the-corner-capital-v5.firebaseapp.com",
projectId: "the-corner-capital-v5",
storageBucket: "the-corner-capital-v5.firebasestorage.app",
messagingSenderId: "682177173816",
appId: "1:682177173816:web:1c849711390f7ca64609cd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const shopsDiv = document.getElementById("shops");

async function loadShops() {

try {

const querySnapshot = await getDocs(collection(db,"shops"));

querySnapshot.forEach((doc) => {

const data = doc.data();

const div = document.createElement("div");

div.className = "shop " + (data.status === "sold" ? "sold" : "available");

div.innerHTML = data.name;

shopsDiv.appendChild(div);

});

} catch(error) {

console.log(error);

}

}

loadShops();

</script>

</body>
</html>
